version: "2"

sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"

    gen:
      go:
        package: "sqlc"
        out: "internal/platform/db/sqlc"
        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_interface: true
        emit_exact_table_names: false
        emit_pointers_for_null_types: false

        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

          - db_type: "timestamptz"
            go_type: "time.Time"

          - db_type: "geography"
            go_type:
              type: "byte"
              slice: true

overrides:
  go:
    rename:
      user_role: UserRoleAssignment