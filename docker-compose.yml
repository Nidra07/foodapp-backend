version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: foodapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodapp
      POSTGRES_PASSWORD: foodapp_local_pw
      POSTGRES_DB: foodapp
    ports:
      - "5432:5432"
    volumes:
      - foodapp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodapp -d foodapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: foodapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: foodapp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: foodapp
      MINIO_ROOT_PASSWORD: foodapp_local_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - foodapp_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    container_name: foodapp-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: minio:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  foodapp_pg_data:
  foodapp_minio_data:
